[project]
name = "nexa-banking-mcp"
version = "0.1.0"
description = "Independent banking MCP server and persistent synthetic banking REST API"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.6,<5",
    "fastapi",
    "httpx",
    "httpx2",
    "cryptography",
    "py-key-value-aio",
    "pydantic>=2",
    "pydantic-settings",
    "pymongo>=4.9,<4.18",
    "structlog",
    "ddtrace",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "mongomock", "openapi-spec-validator", "pyyaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
